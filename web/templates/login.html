<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% include 'partials/theme_head.html' %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Sign in · Naar Automations &amp; Dashboard</title>
    <link rel="icon" href="https://gargashjirabackup.blob.core.windows.net/logos/naar/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
    <form class="login-card" method="post" action="/login">
        <div class="login-brand">
            <img class="brand-logo" src="https://gargashjirabackup.blob.core.windows.net/logos/naar/Naar%20logo.png" alt="Naar">
        </div>
        <h1>Sign in to Naar Automations &amp; Dashboard</h1>
        <p>Enter the team password to open the dashboards.</p>
        {% if error %}<div class="banner login-error" role="alert"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>{% endif %}
        <input type="hidden" name="next" value="{{ next or '/' }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit" class="btn btn--primary">Sign in</button>
    </form>
</body>
</html>
