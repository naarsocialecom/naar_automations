{# Left navigation on every page. Set active_nav to: ndo | scrum | meta-stock #}
<aside class="app-sidebar" aria-label="Main navigation">
    <a class="app-brand" href="/" title="Naar Automations">
        <img src="https://gargashjirabackup.blob.core.windows.net/logos/naar/Naar%20logo.png" alt="Naar">
        <span>Automations</span>
    </a>
    <nav class="app-nav">
        <div class="app-nav-label">Dashboards</div>
        <a class="app-nav-link{{ ' is-active' if active_nav == 'ndo' }}" href="/ndo"><i class="fas fa-headset"></i><span>Incidents &amp; Operations</span></a>
        <a class="app-nav-link{{ ' is-active' if active_nav == 'scrum' }}" href="/dashboard"><i class="fas fa-columns"></i><span>Naar Scrum Dashboard</span></a>

        <div class="app-nav-label">Automations</div>
        <a class="app-nav-link{{ ' is-active' if active_nav == 'meta-stock' }}" href="/automations/meta-campaign-stock"><i class="fas fa-bullhorn"></i><span>Meta Campaign Stock</span></a>
    </nav>
    {% if login_enabled %}
    <form class="app-sidebar-foot" method="post" action="/logout">
        <button type="submit" class="app-nav-link"><i class="fas fa-sign-out-alt"></i><span>Sign out</span></button>
    </form>
    {% endif %}
</aside>
